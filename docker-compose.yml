services:
  lpa-frontend:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/sirius/sirius-lpa-frontend:latest
    build:
      dockerfile: docker/sirius-lpa-frontend/Dockerfile
    depends_on:
      - sirius-mock
    ports: ["8888:8080"]
    privileged: false
    user: app
    read_only: true
    environment:
      HEALTHCHECK: /health-check
      INSECURE_COOKIES:
      PORT: 8080
      SIRIUS_URL: http://sirius-mock:8080
      SIRIUS_PUBLIC_URL: http://sirius-mock:8080
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  sirius-mock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports: ["8563:8080"]
    volumes:
      - "./cypress/mocks:/home/wiremock/mappings"

  puppeteer:
    build: docker/puppeteer
    depends_on:
      - lpa-frontend

  go-lint:
    image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.cache/golangci-lint/v1.53.3:/root/.cache
    command: golangci-lint run -v --timeout 5m --enable gosec --output.text.path stdout --output.sarif.path test-results/golangci-lint.sarif

  npm:
    build:
      context: docker/npm/
    working_dir: /home/node
    entrypoint: npm
    volumes:
      - ./:/home/node

  gosec:
    image: golang:1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280
    working_dir: /app
    volumes:
      - .:/app
    command: go tool gosec -exclude-dir=.gocache -fmt=sarif -out=/app/test-results/gosec.sarif -stdout -verbose=text /app/...

  test-runner:
    build:
      context: .
      dockerfile: docker/test-runner/Dockerfile
    command: go tool gotestsum --junitfile test-results/unit-tests.xml -- ./... -coverprofile=test-results/test-coverage.txt
    working_dir: /go/src/app
    volumes:
      - ./:/go/src/app
      - ./.gocache:/go/pkg/mod

  pact:
    image: 311462405659.dkr.ecr.eu-west-1.amazonaws.com/shared/opg-pact-cli:latest
    working_dir: /go/src/app
    volumes:
      - ./pacts:/go/src/app/pacts

  cypress:
    image: cypress/included:16.3.0@sha256:3efa8d156a094a6c13ddf3fba616e97f7492706685064b75a39823e1147eca97
    platform: "linux/amd64"
    command: run --browser edge
    entrypoint: cypress
    depends_on:
      - lpa-frontend
      - sirius-mock
    environment:
      - CYPRESS_BASE_URL=http://lpa-frontend:8080
      - CYPRESS_MOCK_SERVER_URI=http://sirius-mock:8080
      - CYPRESS_VIDEO=false
    working_dir: /e2e
    volumes:
      - ./:/e2e

  js-test:
    build:
      dockerfile: docker/js-test/Dockerfile
